spring.application.name=job-search-command-center
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Default/private mode. Override this through a Spring profile when needed.
app.database.path=jobsearch.db
app.demo=false

# Application attachments are stored locally in SQLite.
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=12MB
