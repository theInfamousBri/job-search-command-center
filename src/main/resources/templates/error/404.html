<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found · Job Search</title>
    <link rel="stylesheet" th:href="@{/css/app.css?v=1.4.4-form-type}" href="/css/app.css?v=1.4.4-form-type">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/job-search-logo.svg}" href="/images/job-search-logo.svg">
</head>
<body class="error-page">
<main class="error-shell">
    <img class="error-logo" th:src="@{/images/job-search-logo.svg}" src="/images/job-search-logo.svg" alt="">
    <p class="eyebrow">404 · OFF THE MAP</p>
    <h1>Looks like this path didn’t lead where we expected.</h1>
    <p class="error-copy">The page may have moved, or the record you were looking for may no longer exist.</p>
    <div class="error-actions">
        <a class="button button-primary" th:href="@{/}" href="/">Back to Dashboard</a>
        <button class="button button-secondary" type="button" onclick="history.back()">Go back</button>
    </div>
</main>
</body>
</html>
