<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar" th:fragment="sidebar(activePage)">
    <a class="brand" th:href="@{/}">
        <img class="brand-logo" th:src="@{/images/job-search-logo.svg}" src="/images/job-search-logo.svg" alt="Job Search mountain logo">
        <span>
            <strong>Job Search</strong>
            <small>Command Center</small>
        </span>
    </a>

    <nav class="nav">
        <a th:href="@{/}" class="nav-item" th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg></span>
            <span>Dashboard</span>
        </a>

        <a th:href="@{/applications}" class="nav-item" th:classappend="${activePage == 'applications'} ? ' active' : ''">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></span>
            <span>Applications</span>
        </a>

        <a th:href="@{/materials}" class="nav-item" th:classappend="${activePage == 'materials'} ? ' active' : ''">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 12h6M9 16h6"/></svg></span>
            <span>Materials</span>
        </a>

        <a th:href="@{/companies}" class="nav-item" th:classappend="${activePage == 'companies'} ? ' active' : ''">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20V8l8-4 8 4v12"/><path d="M8 20v-5h8v5M8 10h2M14 10h2"/></svg></span>
            <span>Companies</span>
        </a>

        <a th:href="@{/calendar}" class="nav-item" th:classappend="${activePage == 'calendar'} ? ' active' : ''">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="15" rx="2"/><path d="M7 3v5M17 3v5M4 10h16"/></svg></span>
            <span>Calendar</span>
        </a>

        <a th:href="@{/prep}" class="nav-item" th:classappend="${activePage == 'prep'} ? ' active' : ''">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 19 3.5-.8L19 7.7a2.1 2.1 0 0 0-3-3L5.5 15.2zM14.8 5.9l3.3 3.3"/><path d="M4 21h16"/></svg></span>
            <span>Prep / Notes</span>
        </a>

        <a th:href="@{/analytics}" class="nav-item" th:classappend="${activePage == 'analytics'} ? ' active' : ''">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/><path d="M3 20h18"/></svg></span>
            <span>Analytics</span>
        </a>

        <a th:href="@{/data-quality}" class="nav-item" th:classappend="${activePage == 'data-quality'} ? ' active' : ''">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5 9.2 17 19 7"/><path d="M4 4h16v16H4z"/></svg></span>
            <span>Data Quality</span>
        </a>
    </nav>

    <div class="sidebar-footer-card" th:classappend="${demoMode} ? ' demo-storage' : ''">
        <span class="storage-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg></span>
        <span th:if="${demoMode}">
            <strong>Demo mode</strong>
            <small>Synthetic data resets each launch</small>
        </span>
        <span th:unless="${demoMode}">
            <strong>Stored locally</strong>
            <small>Your data lives in <code th:text="${databaseFileName}">jobsearch.db</code></small>
        </span>
    </div>
</aside>

<header class="topbar" th:fragment="topbar">
    <form class="topbar-search" th:action="@{/applications}" method="get">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input type="search" name="q" placeholder="Search applications…" aria-label="Search applications">
        <span class="search-hint">↵</span>
    </form>
    <div class="topbar-actions">
        <span class="local-chip" th:classappend="${demoMode} ? ' demo-chip' : ''"><i></i><span th:text="${demoMode} ? 'Demo' : 'Local'">Local</span></span>
        <a class="topbar-add" th:href="@{/applications/new}" aria-label="Add application" title="Add application">+</a>
    </div>
</header>
</body>
</html>
